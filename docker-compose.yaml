services:
  backend:
    build: ./backend
    container_name: linklive-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:8000
    container_name: linklive-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
